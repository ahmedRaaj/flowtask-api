spring:
  application:
    name: flowtask-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flowtask}
    username: ${DB_USERNAME:flowtask}
    password: ${DB_PASSWORD:flowtask}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
